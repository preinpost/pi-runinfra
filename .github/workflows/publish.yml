# Recover npm publication without bumping a version or rebuilding a tag.
# Always run the current main workflow and publish an explicit existing tag.
name: Publish to npm (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v1.3.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Test release recovery logic
        run: node --test .github/scripts/release.test.mjs

      - name: Resolve and validate release tag
        id: release
        run: node .github/scripts/release.mjs resolve-tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.commit }}
          path: release-package
          persist-credentials: false

      - name: Publish tagged package to npm if missing
        working-directory: release-package
        run: node ../.github/scripts/release.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
