# A release is anchored to its source commit and immutable version tag.
# Retries reuse verified version commits/tags/releases and publish tag contents.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

# Also shared by the manual npm recovery workflow.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Test release recovery logic
        run: node --test .github/scripts/release.test.mjs

      - name: Prepare or resume release
        id: release
        run: node .github/scripts/release.mjs prepare

      - name: Create GitHub Release if missing
        if: steps.release.outputs.skip != 'true'
        run: node .github/scripts/release.mjs github-release "$RELEASE_TAG" "$LATEST"
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LATEST: ${{ steps.release.outputs.latest }}
          GH_TOKEN: ${{ github.token }}

      # Keep the orchestration scripts from this run, but publish only the
      # verified tag's exact commit, never a newer main checkout.
      - uses: actions/checkout@v4
        if: steps.release.outputs.skip != 'true'
        with:
          ref: ${{ steps.release.outputs.commit }}
          path: release-package
          persist-credentials: false

      - name: Publish tagged package to npm if missing
        if: steps.release.outputs.skip != 'true'
        working-directory: release-package
        run: node ../.github/scripts/release.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
